ks</tspan><tspan x="0" y="5.6">NoPartialWritesOnConflict</tspan><tspan x="0" y="26.6">or NoWriteBeforePreflight</tspan></text></g><g class="pele-node pele-state bugPath" data-id="lg3" transform="translate(815.15,112)"><rect x="-108.9" y="-52" width="217.81" height="104" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">Path to the</tspan><tspan x="0" y="-4.9">NoPartialWritesOnConflict</tspan><tspan x="0" y="16.1">or NoWriteBeforePreflight</tspan><tspan x="0" y="37.1">bug</tspan></text></g></g></g></svg>